name: Deploy to Cloudflare Pages

# Checks, builds, and uploads dist/ to Cloudflare Pages with wrangler.
#   main                → production   (https://<project>.pages.dev + your custom domain)
#   any other branch    → preview      (https://<branch>.<project>.pages.dev)
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with "Account → Cloudflare Pages → Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Until both secrets exist the deploy step is skipped (the checks still run).
on:
  push:
    branches: [main, ccr-e80c4bbb-atuxna]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_PROJECT: agent-vs-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Skip deploy (Cloudflare secrets not set yet)
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built but not deployed."

      - name: Create Cloudflare Pages project (first run only)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        # Fails harmlessly with "already exists" after the first run; auth problems surface in the deploy step.
        run: npx --yes wrangler@4 pages project create "${CF_PROJECT}" --production-branch main || echo "Project ${CF_PROJECT} already exists (or could not be created)."

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "${CF_PROJECT}" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(git log -1 --pretty=%s | head -c 300)" \
            --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "Deployed: ${URL}" >> "$GITHUB_STEP_SUMMARY"
